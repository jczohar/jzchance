<style>
html,body{background:#0c0a09;min-height:100%;font-family:'Heebo',system-ui,sans-serif;color:#e7e5e4}
*{scrollbar-width:thin;scrollbar-color:#57534e #1c1917}
button,a,[role="button"]{cursor:pointer;touch-action:manipulation}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.fade-in{animation:fadeIn .28s ease-out both}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.suit-red{color:#f87171}
.suit-black{color:#e7e5e4}
/* קלפים — כמו מפעל הפיס: קלף לבן, דרגה + סמל, אדום/שחור */
.card-chip{
  position:relative;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#ffffff 0%,#f8fafc 55%,#f1f5f9 100%);
  border:1.5px solid #94a3b8;
  border-radius:8px;
  box-shadow:
    0 1px 2px rgba(0,0,0,.12),
    0 4px 10px rgba(0,0,0,.18),
    inset 0 1px 0 #fff;
  font-weight:800;
  user-select:none;
  line-height:1;
  overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease;
}
.card-chip:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(0,0,0,.14), 0 8px 16px rgba(0,0,0,.22), inset 0 1px 0 #fff;
}
.card-chip .cc-pais{
  display:flex;align-items:center;justify-content:center;
  width:100%;margin:0 0 2px;line-height:0;
}
.card-chip .cc-pais-svg{display:block}
.card-chip .cc-rank{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1;
}
.card-chip .cc-sym{
  font-family:Georgia,"Times New Roman",serif;
  line-height:1;
  margin-top:1px;
}
/* אדום: לב + יהלום | שחור: תלתן + עלה */
.card-chip.hearts,
.card-chip.diamonds{ color:#dc2626; border-color:#fca5a5; }
.card-chip.clubs,
.card-chip.spades{ color:#0f172a; border-color:#94a3b8; }
/* פס עליון עדין לפי סדרה — כמו בטופסי פיס */
.card-chip.clubs::before,
.card-chip.diamonds::before,
.card-chip.hearts::before,
.card-chip.spades::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:2px;
  opacity:.85;
}
.card-chip.clubs::before{ background:#166534; }
.card-chip.diamonds::before{ background:#ea580c; }
.card-chip.hearts::before{ background:#dc2626; }
.card-chip.spades::before{ background:#1e293b; }
.card-chip.sm{ width:2.15rem; height:3.15rem; border-radius:6px; padding:0.12rem 0.08rem 0.15rem; }
.card-chip.sm .cc-rank{ font-size:11px; }
.card-chip.sm .cc-sym{ font-size:13px; }
.card-chip.md{ width:2.7rem; height:3.95rem; padding:0.15rem 0.12rem 0.2rem; }
.card-chip.md .cc-rank{ font-size:14px; }
.card-chip.md .cc-sym{ font-size:18px; }
.card-chip.lg{ width:3.35rem; height:4.9rem; border-radius:10px; padding:0.2rem 0.15rem 0.3rem; }
.card-chip.lg .cc-rank{ font-size:18px; }
.card-chip.lg .cc-sym{ font-size:24px; }
.card-chip.hit{
  box-shadow:0 0 0 2px #16a34a, 0 4px 12px rgba(22,163,74,.35), inset 0 1px 0 #fff;
  border-color:#22c55e;
}
.card-chip.hit::after{
  content:"✓";
  position:absolute;bottom:2px;right:3px;
  font-size:9px;color:#16a34a;font-weight:700;line-height:1;
}

.rank-btn{
  width:2.25rem;height:2.25rem;border-radius:0.65rem;font-weight:700;
  font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid;

function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function formatHe(iso) {
  if (!iso) return "—";
  var p = String(iso).slice(0, 10).split("-");
  if (p.length !== 3) return String(iso);
  return p[2] + "/" + p[1] + "/" + p[0];
}
function formatILS(n) {
  return (Number(n) || 0).toLocaleString("he-IL") + " ₪";
}
function cmpDateDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  // באותו תאריך: לפי מספר הגרלה (רץ עם הזמן), ואם שווה — לפי שעה כמספר (לא כטקסט, כדי ש-"9:00" יבוא לפני "13:00")
  var di = (Number(b.id) || 0) - (Number(a.id) || 0);
  if (di) return di;
  var ta = parseTimeToMinutes(a.time), tb = parseTimeToMinutes(b.time);
  return (tb == null ? -1 : tb) - (ta == null ? -1 : ta);
}
function normalizeRank(r) {
  r = String(r || "").trim().toUpperCase();
  if (r === "1" || r === "14") return "A";
  if (r === "11") return "J";
  if (r === "12") return "Q";
  if (r === "13") return "K";
  if (RANK_SET.has(r)) return r;
  return "";
}
function parseChanceDate(s) {
  s = String(s || "").trim();
  if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);

  if (m) {
    var d = +m[1], mo = +m[2], y = +m[3];
    if (mo > 12 && d <= 12) { var t = d; d = mo; mo = t; }
    if (y >= 1990 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31)
      return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    return "";
  }

          return;

        parsed.sort(cmpDateDesc);
        var lim = parseInt(importLimit, 10);
        if (lim > 0 && parsed.length > lim) {

        var added = 0, updated = 0;
        setDraws(function (prev) {
          var map = new Map((prev || []).map(function (x) { return [x.id, x]; }));
          parsed.forEach(function (d) {
            if (!map.has(d.id)) added++; else updated++;
            map.set(d.id, d);

          var next = Array.from(map.values()).sort(cmpDateDesc);
          storageSet(SK.draws, next); idbSet(SK.draws, next);
          return next;
        });
        var check = storageGet(SK.draws);
        var nSaved = Array.isArray(check) ? check.length : 0;
        if (notify) {
          if (nSaved === 0 && parsed.length > 0) {
            notify("ייבוא הצליח במסך, אך השמירה לדיסק נכשלה (אחסון מלא?). נסו גיבוי JSON.", "error");
